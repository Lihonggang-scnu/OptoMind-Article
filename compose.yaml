services:
  optomind-article:
    build:
      context: .
      dockerfile: Dockerfile
    image: optomind-article:local
    ports:
      - "${PORT:-8765}:8080"
    environment:
      PORT: "8080"
      OPTOMIND_HOST: "0.0.0.0"
      OPTOMIND_OUTPUT_ROOT: "/data/runs"
      OPTOMIND_MAX_CONCURRENT_RUNS: "1"
      QWEN_API_KEY: "${QWEN_API_KEY:?Set QWEN_API_KEY in .env or the shell}"
      SEMANTIC_SCHOLAR_API_KEY: "${SEMANTIC_SCHOLAR_API_KEY:-}"
      OPTOMIND_UI_ACCESS_TOKEN: "${OPTOMIND_UI_ACCESS_TOKEN:?Set OPTOMIND_UI_ACCESS_TOKEN in .env or the shell}"
    volumes:
      - optomind-runs:/data/runs
    restart: unless-stopped

volumes:
  optomind-runs:
