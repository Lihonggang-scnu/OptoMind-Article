[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optomind"
version = "0.1.0"
description = "Local spectral target tools for OptoMind multi-agent workflows."
requires-python = ">=3.11"
dependencies = [
    "agentscope>=2.0.2",
    "arxiv>=2.3",
    "beautifulsoup4>=4.13",
    "ddgs>=9.0",
    "fastapi>=0.115",
    "feedparser>=6.0",
    "ftfy>=6.3",
    "json-repair>=0.47",
    "lxml>=5.4",
    "matplotlib>=3.11",
    "numpy>=2.0",
    "openai>=2.43",
    "pandas>=2.2",
    "pillow>=10",
    "pymupdf>=1.27",
    "pydantic>=2.10",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "python-pptx>=1.0",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.13",
    "sse-starlette>=2.3",
    "tavily-python>=0.7",
    "uvicorn>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]
physics = [
    "refractiveindex>=1.0,<2",
    "tmm>=0.2,<0.3",
]
differentiable = [
    "torch>=1.13",
]
optimization = [
    "scipy>=1.11",
    "torch>=1.13",
]

[tool.setuptools.packages.find]
include = ["optomind*", "tmm_engine*", "config*", "llm*", "tools*"]

[tool.setuptools.package-data]
tmm_engine = ["materials/*.csv", "rii_cache.db", "TMM_SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["external_tools", "optmind-legacy", ".git", ".venv"]
