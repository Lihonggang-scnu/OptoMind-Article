model_aliases:
  # Tier A: top reasoning, synthesis, and final-report tasks. Highest cost; use only for key steps.
  a_model: qwen3.7-max
  premium_model: qwen3.7-max
  # Temporary near-A fallback. Alibaba Cloud currently schedules this preview
  # model for retirement on 2026-10-10, so it must never be the only fallback.
  a_minus_model: qwen3.6-max-preview

  # Tier B family. Keep the historical advanced_model alias at B+ so existing
  # agents retain their quality target while gaining multiple same-family exits.
  b_plus_model: qwen3.7-flash
  b_model: qwen3.6-plus
  b_minus_model: qwen3.6-35b-a3b
  advanced_model: qwen3.7-flash

  # Tier C: medium-complexity tasks, batch structured extraction, and secondary filtering.
  c_plus_model: qwen3.6-flash
  c_model: qwen3.5-plus
  standard_model: qwen3.6-flash

  # Tier C2: cheaper batch labeling / profiling model. Kept separate from Tier C for experiments.
  c2_model: qwen3.5-flash
  profiler_model: qwen3.5-flash
  slice_profiler_model: qwen3.5-flash

  # Tier D: low-risk rough screening, formatting, and log summarization.
  d_model: qwen-flash
  cheap_model: qwen-flash

  # Current native multimodal models. Legacy qwen-vl-plus/max aliases are not
  # used on the mainline because current Qwen 3.5/3.6/3.7 models accept images.
  vision_model: qwen3.6-plus
  vision_fast_model: qwen3.6-flash
  vision_plus_model: qwen3.6-plus
  vision_premium_model: qwen3.7-flash

model_fallbacks:
  premium_model: [a_minus_model, b_plus_model, b_model]
  a_model: [a_minus_model, b_plus_model, b_model]
  a_minus_model: [b_plus_model, b_model, b_minus_model]
  advanced_model: [b_model, b_minus_model, c_plus_model]
  b_plus_model: [b_model, b_minus_model, c_plus_model]
  b_model: [b_minus_model, c_plus_model, c_model]
  b_minus_model: [c_plus_model, c_model, c2_model]
  standard_model: [c_model, c2_model, d_model]
  c_plus_model: [c_model, c2_model, d_model]
  c_model: [c2_model, d_model]
  c2_model: [c_plus_model, d_model]
  profiler_model: [c_plus_model, c2_model, d_model]
  slice_profiler_model: [c_plus_model, c2_model, d_model]
  cheap_model: [c2_model, c_plus_model]
  d_model: [c2_model, c_plus_model]
  vision_premium_model: [vision_plus_model, vision_fast_model, qwen3.5-plus]
  vision_plus_model: [vision_fast_model, qwen3.5-plus, qwen3.5-flash]
  vision_model: [vision_fast_model, qwen3.5-plus, qwen3.5-flash]
  vision_fast_model: [qwen3.5-flash, qwen3.5-plus]

default_model_tier: standard_model

agent_model_policy:
  QueryPlannerAgent: premium_model
  AtomicRelevancePlannerAgent: premium_model
  LiteratureQueryExpansionAgent: standard_model
  FeatureLevelPaperScorerAgent: standard_model
  SourceCredibilityAuditorAgent: cheap_model
  ScrapedPageCacheAuditorAgent: cheap_model
  WebLensContextExtractorAgent: standard_model
  SupplementalScholarFacetSynthesizerAgent: advanced_model
  QueryPlannerFormatRepairAgent: standard_model
  TaskPlannerAgent: premium_model
  EvidenceAgent: advanced_model
  TargetReasonerAgent: advanced_model
  LLMReviewAgent: premium_model
  CentralOrchestratorAgent: premium_model
  WorkflowSecretaryTool: cheap_model
  # High-volume structured fulltext extraction: the compact B- model proved
  # more transport-stable than Plus on long JSON generations; later A-tier
  # review/repair remains responsible for semantic quality escalation.
  PaperTextCardAgent: b_minus_model
  ReviewArchitectAgent: premium_model
  BlueprintCouncil: premium_model
  BlueprintTournamentJudge: premium_model
  SectionMaterialMapperAgent: advanced_model
  SectionWriterAgent: premium_model
  FigurePlannerAgent: advanced_model
  PaperCardEnglishNormalizerAgent: advanced_model
  PerspectiveQuestionAskerAgent: premium_model
  PerspectiveEnglishRepairAgent: standard_model
  PerspectiveJsonRepairAgent: standard_model
  TextSliceRoleProfilerAgent: slice_profiler_model
  SubfigureVisualTaggerAgent: vision_fast_model
  ScientificReviewChineseTranslator: c2_model
  ScientificChineseTranslationAuditor: c2_model

routing_rules:
  explicit_task:
    default_tier: advanced_model
    allow_literature_search: false
  semi_explicit_task:
    default_tier: advanced_model
    allow_literature_search: true
  ambiguous_task:
    default_tier: premium_model
    allow_literature_search: true
  high_risk_review:
    default_tier: premium_model
  logging_or_formatting:
    default_tier: cheap_model

mock_llm:
  enabled_when_no_key: true
