site_name: VeriTMM
site_description: >-
  An AI-ready, verifier-first transfer-matrix tool for autonomous
  multilayer-optics research.
site_url: https://lihonggang-scnu.github.io/VeriTMM/
repo_url: https://github.com/Lihonggang-scnu/VeriTMM
repo_name: Lihonggang-scnu/VeriTMM

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            heading_level: 2

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Cookbook: cookbook.md
  - Architecture: ARCHITECTURE.md
  - Workbench: WORKBENCH.md
  - Validation: VALIDATION.md
  - Experiments: EXPERIMENTS.md
  - Sweeps: SWEEPS.md
  - Sensitivity: SENSITIVITY.md
  - Uncertainty: UNCERTAINTY.md
  - Robust optimization: ROBUST_OPTIMIZATION.md
  - AgentBench: AGENTBENCH.md
  - Agent Skill: AGENT_SKILL.md
  - Research interface: RESEARCH_INTERFACE.md
  - Dataset factory: DATASET_FACTORY.md
  - API reference: api.md
  - v1.1 proposal (中文): UPGRADE_PROPOSAL.zh-CN.md
